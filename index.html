<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Noteflow — a quiet place for notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-serif: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;

  --bg:        #faf8f5;
  --panel:     #ffffff;
  --sidebar:   #f2efeb;
  --text:      #1f1d1a;
  --soft:      #6f6862;
  --faint:     #a49c93;
  --line:      #e7e2db;
  --hover:     rgba(31,29,26,.045);
  --accent:    #c2643f;
  --accent-soft: rgba(194,100,63,.11);
  --danger:    #b4442f;
  --danger-soft: rgba(180,68,47,.09);
  --ok:        #5a9e6f;
  --warn:      #b58b1f;
}
html[data-theme="dark"]{
  --bg:        #171614;
  --panel:     #1e1c1a;
  --sidebar:   #131211;
  --text:      #f2efe9;
  --soft:      #a49c92;
  --faint:     #6e6862;
  --line:      #2c2926;
  --hover:     rgba(242,239,233,.05);
  --accent:    #e08358;
  --accent-soft: rgba(224,131,88,.14);
  --danger:    #e0785f;
  --danger-soft: rgba(224,120,95,.1);
  --ok:        #7ab98d;
  --warn:      #d4ab4a;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-ui);
  font-size:14px;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit}
input,textarea{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft);color:var(--text)}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box;border:3px solid transparent}

/* ============ layout ============ */
.app{
  display:grid;
  grid-template-columns:296px 1fr;
  height:100vh;
  height:100dvh;
}

/* ============ sidebar ============ */
.sidebar{
  background:var(--sidebar);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-height:0;
}
.side-head{
  display:flex;align-items:center;gap:6px;
  padding:16px 14px 12px 18px;
}
.brand{
  display:flex;align-items:center;gap:9px;
  flex:1;font-weight:600;font-size:14.5px;letter-spacing:-.01em;
  min-width:0;
}
.brand svg{width:17px;height:17px;color:var(--accent);flex:none}
.brand span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .dot{color:var(--faint);font-weight:400;font-style:italic;font-family:var(--font-serif);font-size:12.5px;letter-spacing:0;flex:none}

.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;flex:none;
  border:0;border-radius:8px;background:transparent;
  cursor:pointer;color:var(--soft);
  transition:background .15s ease,color .15s ease,transform .1s ease;
  position:relative;
}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn:active{transform:scale(.93)}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.icon-btn.danger:hover{color:var(--danger);background:var(--danger-soft)}
#newBtn{background:var(--accent);color:#fff;width:28px;height:28px;border-radius:9px}
#newBtn:hover{background:var(--accent);filter:brightness(1.08);color:#fff}
#cmdkBtn{width:28px;height:28px}

.icon-btn .badge{
  position:absolute;
  top:-1px;right:-1px;
  min-width:15px;height:15px;
  padding:0 4px;
  border-radius:99px;
  background:var(--accent);
  color:#fff;
  font-size:9.5px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  border:2px solid var(--sidebar);
  box-sizing:content-box;
  pointer-events:none;
}

.guest-banner{
  display:flex;align-items:center;gap:8px;
  margin:0 12px 8px;
  padding:8px 10px 8px 11px;
  background:var(--accent-soft);
  border:1px solid rgba(194,100,63,.22);
  border-radius:10px;
  font-size:11.5px;color:var(--accent);line-height:1.5;
}
html[data-theme="dark"] .guest-banner{border-color:rgba(224,131,88,.25);}
.guest-banner svg{width:13px;height:13px;flex:none;opacity:.85;}
.guest-banner-text{flex:1;min-width:0;}
.guest-banner-btn{
  border:0;background:rgba(194,100,63,.16);color:var(--accent);
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;
  cursor:pointer;flex:none;transition:background .13s ease;white-space:nowrap;
}
.guest-banner-btn:hover{background:rgba(194,100,63,.3);}

.search-wrap{
  position:relative;margin:0 12px 8px;
  display:flex;align-items:center;
}
.search-wrap svg{
  position:absolute;left:10px;width:14px;height:14px;color:var(--faint);pointer-events:none;
}
#search{
  width:100%;border:1px solid transparent;border-radius:9px;
  background:var(--panel);
  padding:7px 28px 7px 31px;
  font-size:13px;outline:none;
  transition:border-color .15s ease,box-shadow .15s ease;
}
#search::placeholder{color:var(--faint)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#clearSearch{
  position:absolute;right:5px;width:20px;height:20px;border:0;border-radius:6px;
  background:transparent;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
#clearSearch:hover{color:var(--text);background:var(--hover)}

.tag-strip{
  display:flex;flex-wrap:wrap;gap:5px;
  padding:0 12px 10px;max-height:88px;overflow-y:auto;
}
.tag-chip{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line);background:var(--panel);color:var(--soft);
  border-radius:99px;padding:3px 9px 3px 8px;
  font-size:11.5px;font-weight:500;cursor:pointer;
  transition:background .13s ease,border-color .13s ease,color .13s ease;
  max-width:100%;
}
.tag-chip:hover{background:var(--hover);border-color:var(--faint);color:var(--text)}
.tag-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.tag-chip .tag-count{font-size:10px;font-weight:600;opacity:.65;padding:0 1px;font-variant-numeric:tabular-nums;}
.tag-clear{
  border:0;background:transparent;color:var(--faint);
  font-size:11px;font-weight:500;cursor:pointer;padding:3px 8px;
  border-radius:99px;transition:background .13s ease,color .13s ease;
}
.tag-clear:hover{background:var(--hover);color:var(--text)}

.view-banner{
  display:flex;align-items:center;gap:8px;
  margin:0 12px 10px;padding:8px 11px;
  background:var(--danger-soft);border:1px solid rgba(180,68,47,.18);
  border-radius:10px;font-size:12px;color:var(--danger);
}
.view-banner-label{font-weight:600;letter-spacing:.01em;}
.view-banner-count{font-variant-numeric:tabular-nums;opacity:.7;}
.view-banner-back{
  margin-left:auto;border:0;background:rgba(180,68,47,.14);
  color:var(--danger);font-size:11px;font-weight:500;
  padding:4px 9px;border-radius:99px;cursor:pointer;
  transition:background .13s ease;
}
.view-banner-back:hover{background:rgba(180,68,47,.22)}

.list{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:2px 8px 16px;
}
.list-empty{
  padding:36px 20px;text-align:center;color:var(--faint);
  font-size:13px;line-height:1.8;
}
.list-empty kbd{
  font-family:var(--font-ui);font-size:11px;font-weight:500;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;color:var(--soft);background:var(--panel);
}

.note-item{
  display:block;width:100%;text-align:left;
  border:0;background:transparent;border-radius:10px;
  padding:9px 11px;margin-bottom:1px;cursor:pointer;
  transition:background .13s ease;
}
.note-item:hover{background:var(--hover)}
.note-item.active{background:var(--accent-soft)}
.note-row{display:flex;align-items:baseline;gap:6px}
.note-title{
  flex:1;min-width:0;
  font-size:13.5px;font-weight:500;letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text);
}
.note-item.active .note-title{font-weight:600;color:var(--accent)}
.note-pin{width:11px;height:11px;flex:none;color:var(--accent);opacity:.85;align-self:center}
